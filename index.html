<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>همزة وصل — مؤسسة النور</title>
<meta name="theme-color" content="#0B4F46">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="همزة وصل">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #0B4F46; --gold: #D9A441;
    --paper: #FBF8F1; --ink: #1F2937; --muted: #5B6470; --line: #E7E2D6;
    --btn-bg: #0B4F46; --btn-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12302B; --ink: #EEF3F1; --muted: #A9BDB8; --line: #24463F;
      --btn-bg: #D9A441; --btn-ink: #0B2E29;
    }
  }
  html, body { margin: 0; height: 100%; background: var(--deep); }
  body { font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #F1EEE4; }

  #splash {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px;
    background: var(--deep); color: #FFFFFF; text-align: center; transition: opacity .35s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img { width: 112px; height: 112px; border-radius: 28px; }
  #splash h1 { font-weight: 800; font-size: 1.9rem; margin: 18px 0 0; }
  #splash p { margin: 2px 0 0; color: var(--gold); font-weight: 600; }
  #splash .setup { margin-top: 22px; max-width: 30ch; color: #FFFFFF; line-height: 1.8; }

  #banner {
    position: fixed; z-index: 6; left: 12px; right: 12px; margin: 0 auto; max-width: 520px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 14px 8px;
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 12px 32px rgba(8, 56, 50, .28);
  }
  #banner[hidden] { display: none; }
  #banner svg { flex: none; width: 28px; height: 28px; margin-top: 2px; color: var(--gold); }
  #banner .txt { flex: 1; min-width: 0; }
  #banner h2 { margin: 0; font-size: 1.02rem; font-weight: 800; line-height: 1.5; }
  #banner p { margin: 2px 0 0; font-size: .92rem; line-height: 1.7; color: var(--muted); }
  #bannerDetail { margin-top: 6px; font-size: .78rem; color: var(--muted); direction: ltr; text-align: left; overflow-wrap: anywhere; }
  #bannerDetail[hidden] { display: none; }
  #bannerBtn {
    margin-top: 10px; min-height: 44px; padding: 6px 18px; border: 0; border-radius: 12px;
    background: var(--btn-bg); color: var(--btn-ink); font: inherit; font-weight: 800; cursor: pointer;
  }
  #bannerBtn[hidden] { display: none; }
  #bannerBtn:disabled { opacity: .6; cursor: wait; }
  #bannerClose {
    flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent;
    color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer;
  }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
<iframe id="app" title="همزة وصل" allow="autoplay; fullscreen; clipboard-write"></iframe>

<div id="splash" role="status">
  <div>
    <img src="icon-192.png" alt="">
    <h1>همزة وصل</h1>
    <p>مؤسسة النور — غرداية</p>
    <div class="setup" id="setupMsg" hidden></div>
  </div>
</div>

<div id="banner" role="region" aria-label="الإشعارات" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
  </svg>
  <div class="txt">
    <h2 id="bannerTitle"></h2>
    <p id="bannerText"></p>
    <p id="bannerDetail" hidden></p>
    <button id="bannerBtn" type="button" hidden></button>
  </div>
  <button id="bannerClose" type="button" aria-label="إخفاء">×</button>
</div>

<script>
  // ============ الإعداد: الصق هنا رابط تطبيق الويب من آبس سكريبت ============
  // (في محرر السكريبت: Deploy ← Manage deployments ← انسخ Web app URL)
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbxwZbVzhlmAkhlXbs0DXcOYBxYgI79XbWPxs4mY-8J34r5P06AQL8cJ2BFdz3EnbqA04g/exec';
  const ONESIGNAL_APP_ID = '323d16bc-60a2-4851-80c1-279312544690';
  // ==========================================================================

  const BASE = location.pathname.replace(/[^/]*$/, '');  // مجلد التطبيق، مثل /hamzat-wasl/
  const $ = id => document.getElementById(id);
  const frame = $('app'), splash = $('splash');
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  let inner = null, innerOrigin = '';  // نافذة البرنامج داخل الإطار، تُعرف من أول رسالة يرسلها
  let parentIn = false;                // هل ولي مسجّل دخوله الآن؟
  let subId = null;                    // رقم اشتراك هذا الهاتف في الإشعارات
  let OS = null, installEvt = null, state = null, pushFailed = '';  // pushFailed: سبب تعذر التشغيل كما أعاده ون سيجنال
  let dismissed = sessionStorage.getItem('nourBannerHidden') === '1';

  /* ---------- تحميل البرنامج ---------- */
  if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(EXEC_URL)) {
    frame.src = EXEC_URL;
    frame.addEventListener('load', () => setTimeout(() => splash.classList.add('gone'), 300));
    setTimeout(() => splash.classList.add('gone'), 10000);
  } else {
    $('setupMsg').textContent = 'لم يُضبط رابط البرنامج بعد: افتح الملف index.html وألصق رابط تطبيق الويب من آبس سكريبت في السطر المخصص له.';
    $('setupMsg').hidden = false;
  }

  /* ---------- الرسائل مع البرنامج ---------- */
  function send(msg) {
    if (inner) inner.postMessage(Object.assign({ ns: 'nour' }, msg), innerOrigin);
  }
  function loadSession() {
    try {
      const s = JSON.parse(localStorage.getItem('nourSession') || 'null');
      return s && typeof s.token === 'string' && s.type === 'parent' ? s : null;
    } catch (e) { return null; }
  }

  window.addEventListener('message', ev => {
    // لا نقبل إلا رسائل البرنامج المعروض داخل هذه الصفحة نفسها، لا من أي نافذة أخرى
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(ev.origin)) return;
    let ours = false;
    try { ours = !!ev.source && ev.source !== window && ev.source.top === window; } catch (e) { ours = false; }
    const m = ev.data || {};
    if (!ours || m.ns !== 'nour') return;
    inner = ev.source; innerOrigin = ev.origin;

    if (m.type === 'hello') {
      // الآيفون قد يمسح تخزين الصفحة المضمَّنة، فنعيد إليها الجلسة المحفوظة هنا
      const saved = loadSession();
      if (!m.parent && saved) send({ type: 'session', session: saved });
      setParent(!!m.parent);
    } else if (m.type === 'login') {
      const s = m.session || {};
      if (typeof s.token === 'string' && s.type === 'parent') localStorage.setItem('nourSession', JSON.stringify({ token: s.token, type: 'parent' }));
      setParent(true);
    } else if (m.type === 'state') {
      setParent(!!m.parent);
    } else if (m.type === 'logout') {
      localStorage.removeItem('nourSession');
      setParent(false);
      setBadge(0);
    } else if (m.type === 'unread') {
      setBadge(Math.max(0, parseInt(m.count, 10) || 0));
    }
  });

  function setParent(v) {
    parentIn = v;
    if (v && subId) send({ type: 'sub', subId: subId });
    render();
  }

  // العودة إلى التطبيق (غالباً بلمس إشعار): نطلب من البرنامج جلب الجديد
  document.addEventListener('visibilitychange', () => { if (!document.hidden) send({ type: 'refresh' }); });

  /* ---------- عدد الجديد على الأيقونة ---------- */
  // أندرويد يعدّ الإشعارات بنفسه؛ الآيفون والحاسوب يعرضان الرقم الذي نضعه هنا
  async function setBadge(n) {
    try { if ('setAppBadge' in navigator) await (n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge()); } catch (e) {}
    try { const c = await caches.open('nour-badge'); await c.put('badge-count', new Response(String(n))); } catch (e) {}
  }

  /* ---------- الإشعارات (OneSignal) ---------- */
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    try {
      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        serviceWorkerPath: BASE.slice(1) + 'OneSignalSDKWorker.js',
        serviceWorkerParam: { scope: BASE },
        notifyButton: { enable: false }
      });
    } catch (e) {
      // غالباً: رابط الموقع في إعدادات ون سيجنال لا يطابق رابط هذه الصفحة
      console.error('OneSignal init failed', e);
      pushFailed = String((e && e.message) || e || 'unknown error');
      render();
      return;
    }
    OS = OneSignal;
    const ps = OneSignal.User.PushSubscription;
    onSub(ps.id, ps.optedIn);
    ps.addEventListener('change', e => onSub(e.current.id, e.current.optedIn));
    OneSignal.Notifications.addEventListener('permissionChange', render);
    render();
  });

  function onSub(id, optedIn) {
    subId = (id && optedIn) ? id : null;
    if (subId && parentIn) send({ type: 'sub', subId: subId });
    render();
  }

  /* ---------- شريط التنبيه أسفل الشاشة ---------- */
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; render(); });
  window.addEventListener('appinstalled', () => { installEvt = null; render(); });

  const TEXTS = {
    ask:     ['فعّل الإشعارات', 'ليصلك كل جديد من المؤسسة فور نشره، حتى والتطبيق مغلق.', 'تفعيل الإشعارات'],
    ios:     ['أضف التطبيق إلى الشاشة الرئيسية', 'على الآيفون لا تصل الإشعارات إلا بعد ذلك: اضغط زر المشاركة في سفاري، ثم «إضافة إلى الشاشة الرئيسية»، وافتح التطبيق من أيقونته.', ''],
    failed:  ['تعذر تشغيل الإشعارات', 'أبلغ إدارة المؤسسة بذلك لتصلح الإعداد.', ''],
    denied:  ['الإشعارات محظورة', 'افتح إعدادات الموقع في المتصفح واسمح بالإشعارات، ثم أعد فتح التطبيق.', ''],
    install: ['ثبّت التطبيق على هاتفك', 'ليظهر بأيقونته بين تطبيقاتك ويُفتح بلمسة واحدة.', 'تثبيت']
  };

  function currentState() {
    if (!parentIn || dismissed) return null;
    if (isIOS && !standalone) return 'ios';
    if (pushFailed) return 'failed';
    if (OS && OS.Notifications.isPushSupported() && !subId) {
      return ('Notification' in window && Notification.permission === 'denied') ? 'denied' : 'ask';
    }
    if (installEvt && !standalone) return 'install';
    return null;
  }

  function render() {
    state = currentState();
    $('banner').hidden = !state;
    if (!state) return;
    const [title, text, action] = TEXTS[state];
    $('bannerTitle').textContent = title;
    $('bannerText').textContent = text;
    $('bannerBtn').textContent = action;
    $('bannerBtn').hidden = !action;
    // السبب التقني يظهر عند التعذر فقط، ليُنقل كما هو إلى من يصلح الإعداد
    $('bannerDetail').textContent = state === 'failed' ? pushFailed : '';
    $('bannerDetail').hidden = state !== 'failed';
  }

  $('bannerBtn').addEventListener('click', async () => {
    const btn = $('bannerBtn');
    btn.disabled = true;
    try {
      if (state === 'install' && installEvt) {
        installEvt.prompt();
        await installEvt.userChoice;
        installEvt = null;
      } else if (state === 'ask' && OS) {
        if (OS.Notifications.permission) await OS.User.PushSubscription.optIn();
        else await OS.Notifications.requestPermission();
      }
    } catch (e) {
      console.error(e);
    }
    btn.disabled = false;
    render();
  });

  $('bannerClose').addEventListener('click', () => {
    dismissed = true;
    sessionStorage.setItem('nourBannerHidden', '1');  // يعود في الفتح القادم
    render();
  });
</script>
</body>
</html>
