<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>همزة وصل — مؤسسة النور للتربية والتعليم</title>

<meta name="theme-color" content="#0d4f4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="همزة وصل">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #0d4f4a;
        font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif;
    }

    /* ===== الشاشة الافتتاحية ===== */
    #splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        padding: 28px;
        background: linear-gradient(160deg, #0d4f4a 0%, #12695f 55%, #0a3d39 100%);
        color: #fff;
        transition: opacity .6s ease;
    }

    #splash.fade-out { opacity: 0; pointer-events: none; }

    .sp-org {
        font-size: 20px;
        font-weight: 800;
        color: #f2c94c;
        line-height: 1.6;
    }

    .sp-logo {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 10px 34px rgba(0, 0, 0, .35);
    }

    .sp-logo img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }

    .sp-app {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: .3px;
    }

    .sp-ver {
        font-size: 13px;
        font-weight: 600;
        opacity: .8;
        letter-spacing: 1px;
    }

    .sp-bar {
        width: 132px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, .22);
        overflow: hidden;
        margin-top: 6px;
    }

    .sp-bar span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 4px;
        background: #f2c94c;
        animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
        0%   { transform: translateX(160%); }
        100% { transform: translateX(-160%); }
    }

    /* ===== إطار البرنامج ===== */
    #appFrame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
    }

    /* ===== أشرطة التثبيت والإشعارات ===== */
    #notifyBar, #installBar {
        position: fixed;
        z-index: 60;
        left: 12px;
        right: 12px;
        bottom: 14px;
        display: none;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #0d4f4a;
        color: #fff;
        box-shadow: 0 8px 26px rgba(0, 0, 0, .3);
        font-size: 13.5px;
        line-height: 1.6;
    }

    #notifyBar b, #installBar b { color: #f2c94c; }

    #notifyBar button, #installBar button {
        flex-shrink: 0;
        border: 0;
        border-radius: 10px;
        padding: 9px 15px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 800;
        color: #0d4f4a;
        background: #f2c94c;
        cursor: pointer;
    }

    #notifyBar .close-x, #installBar .close-x {
        background: transparent;
        color: #fff;
        opacity: .7;
        padding: 4px 6px;
        font-size: 16px;
    }
</style>
</head>
<body>

<!-- ===================== الشاشة الافتتاحية ===================== -->
<div id="splash">
    <div class="sp-org">مؤسسة النور للتربية والتعليم</div>
    <div class="sp-logo"><img src="logo.png" alt="لوقو المؤسسة" onerror="this.style.display='none'"></div>
    <div class="sp-app">برنامج همزة وصل</div>
    <div class="sp-ver">النسخة_01_2026</div>
    <div class="sp-bar"><span></span></div>
</div>

<!-- ===================== إطار البرنامج ===================== -->
<iframe id="appFrame" title="همزة وصل" allow="clipboard-write; fullscreen"></iframe>

<!-- ===================== شريط تثبيت التطبيق ===================== -->
<div id="installBar">
    <div style="flex:1" id="installText">ثبّت <b>همزة وصل</b> على شاشة هاتفك.</div>
    <button type="button" id="installBtn" onclick="doInstall()">تثبيت</button>
    <button type="button" class="close-x" onclick="hideInstallBar(true)">✕</button>
</div>

<!-- ===================== شريط تفعيل الإشعارات ===================== -->
<div id="notifyBar">
    <div style="flex:1">فعّل <b>الإشعارات</b> ليصلك تنبيه فور نشر المؤسسة منشوراً جديداً.</div>
    <button type="button" onclick="askNotifications()">تفعيل</button>
    <button type="button" class="close-x" onclick="hideNotifyBar(true)">✕</button>
</div>

<!-- ===================== إعدادات يجب ملؤها ===================== -->
<script>
    /* ============================================================
       املأ القيمتين التاليتين فقط:
       ============================================================ */

    // 1) رابط نشر برنامجك في Google Apps Script المنتهي بـ /exec
   var GAS_URL = 'https://script.google.com/macros/s/AKfycbyKrE5Ao8LC3lgVy9nO3M1e6BdTir5lR-yibJGDhnyOkEJwQc4eLqn6RZr6enRN0SLzfA/exec';   
   
    // 2) App ID من حساب OneSignal
    var ONESIGNAL_APP_ID = '323d16bc-60a2-4851-80c1-279312544690';

    // 3) مسار المستودع على GitHub Pages (اسم المستودع بين شرطتين)
    var REPO_PATH = 'https://github.com/ennourcoran-boop/hamzat-wasl/blob/main/index.html';
</script>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
    /* ===================== تحميل البرنامج داخل التطبيق ===================== */
    (function loadApp() {
        var frame = document.getElementById('appFrame');
        if (GAS_URL.indexOf('_HERE') !== -1) {
            document.getElementById('splash').innerHTML =
                '<div class="sp-org">لم يُضبط رابط البرنامج بعد</div>' +
                '<div class="sp-ver">عدّل قيمة GAS_URL داخل ملف index.html</div>';
            return;
        }
        frame.src = GAS_URL;
        // إخفاء الشاشة الافتتاحية بعد تحميل البرنامج (وبحد أقصى 6 ثوانٍ)
        var done = false;
        function hideSplash() {
            if (done) return;
            done = true;
            var sp = document.getElementById('splash');
            sp.classList.add('fade-out');
            setTimeout(function () {
                sp.style.display = 'none';
                if (typeof isIOS !== 'undefined' && isIOS) showInstallBar();
                maybeShowNotifyBar();
            }, 700);
        }
        frame.addEventListener('load', function () { setTimeout(hideSplash, 1400); });
        setTimeout(hideSplash, 6000);
    })();

    /* ===================== تسجيل عامل الخدمة (شرط التثبيت) ===================== */
    // إن لم تُضبط مفاتيح OneSignal بعد، نسجّل العامل يدوياً حتى يبقى التطبيق قابلاً للتثبيت
    if ('serviceWorker' in navigator && ONESIGNAL_APP_ID.indexOf('_HERE') !== -1) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register(REPO_PATH + 'OneSignalSDKWorker.js', { scope: REPO_PATH })
                .catch(function (e) { console.log('SW register failed:', e); });
        });
    }

    /* ===================== تثبيت التطبيق ===================== */
    var deferredPrompt = null;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        showInstallBar();
    });

    window.addEventListener('appinstalled', function () { hideInstallBar(false); });

    function showInstallBar() {
        if (isStandalone) return;
        try { if (localStorage.getItem('hw_install_dismissed') === '1') return; } catch (e) {}
        if (isIOS) {
            document.getElementById('installText').innerHTML =
                'لتثبيت <b>همزة وصل</b>: اضغط زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية».';
            document.getElementById('installBtn').style.display = 'none';
        }
        document.getElementById('installBar').style.display = 'flex';
        document.getElementById('notifyBar').style.bottom = '84px';
    }

    function hideInstallBar(remember) {
        document.getElementById('installBar').style.display = 'none';
        document.getElementById('notifyBar').style.bottom = '14px';
        if (remember) { try { localStorage.setItem('hw_install_dismissed', '1'); } catch (e) {} }
    }

    function doInstall() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; hideInstallBar(false); });
    }

    /* ===================== تهيئة الإشعارات ===================== */
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function (OneSignal) {
        if (ONESIGNAL_APP_ID.indexOf('_HERE') !== -1) return;
        OneSignal.init({
            appId: ONESIGNAL_APP_ID,
            serviceWorkerPath: REPO_PATH + 'OneSignalSDKWorker.js',
            serviceWorkerParam: { scope: REPO_PATH },
            allowLocalhostAsSecureOrigin: true
        });
    });

    function notifPermission() {
        try { return (window.Notification && Notification.permission) || 'default'; }
        catch (e) { return 'default'; }
    }

    function maybeShowNotifyBar() {
        if (ONESIGNAL_APP_ID.indexOf('_HERE') !== -1) return;
        if (notifPermission() === 'granted') return;
        try { if (localStorage.getItem('hw_notify_dismissed') === '1') return; } catch (e) {}
        document.getElementById('notifyBar').style.display = 'flex';
    }

    function hideNotifyBar(remember) {
        document.getElementById('notifyBar').style.display = 'none';
        if (remember) { try { localStorage.setItem('hw_notify_dismissed', '1'); } catch (e) {} }
    }

    function askNotifications() {
        hideNotifyBar(false);
        OneSignalDeferred.push(function (OneSignal) {
            OneSignal.Notifications.requestPermission().catch(function () {});
        });
    }
</script>

</body>
</html>
